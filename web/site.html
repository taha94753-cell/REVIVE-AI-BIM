<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0C0D0F">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>REVIVE site update</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7.5' fill='%23FFC21A'/%3E%3Cg fill='none' stroke='%23111214' stroke-width='2.6' stroke-linecap='square'%3E%3Cpath d='M5.5 26h21M8 26V13M15 26V13M22 26v-6.5'/%3E%3Cpath stroke-width='2' d='M8 19.5h14M8 13h7'/%3E%3Cpath stroke-linecap='round' stroke-linejoin='round' d='M18 13.2C19.2 9.6 21.8 7.6 25.4 7.2M22.8 4.6l2.8 2.6-2.6 2.9'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/css/app.css?v=6.0.0">
  <link rel="stylesheet" href="/assets/css/workspace.css?v=6.1.0">
  <script src="/vendor/motion/motion.js?v=14.0.0" defer></script>
  <script type="module" src="/assets/js/site.js?v=4.0.1"></script>
</head>
<body class="site">
<header class="site-top"><span class="wordmark"><svg class="rv rv-go" viewBox="0 0 32 32" aria-hidden="true"><rect class="rv-plate" width="32" height="32" rx="7.5"/><path class="rv-fl" d="M8 19.5h14M8 13h7"/><path class="rv-slab" d="M5.5 26h21"/><g class="rv-ring"><path class="rv-arc" pathLength="1" d="M18 13.2C19.2 9.6 21.8 7.6 25.4 7.2"/><path class="rv-head" d="M22.8 4.6l2.8 2.6-2.6 2.9"/></g><path class="rv-bar" d="M8 26V13"/><path class="rv-bar" d="M15 26V13"/><path class="rv-bar" d="M22 26v-6.5"/></svg><span>REVIVE</span></span><span class="site-conn" id="site-conn" data-state="connecting"><i></i><span>Connecting</span></span></header>
<main class="site-main">
  <h1 id="p-name">Loading project</h1>
  <p class="muted" id="p-sub"></p>
  <div id="p-now" class="site-now"></div>
  <div id="queue-note" class="site-queue" hidden></div>

  <form id="site-form" novalidate>
    <label class="site-field">Your name or role<input id="reporter" autocomplete="name" placeholder="Site engineer"></label>

    <label class="site-field">Contract time elapsed <output id="elapsed-out">25%</output>
      <input id="elapsed" type="range" min="1" max="100" step="1" value="25"></label>

    <div class="site-row">
      <label class="site-field">SPI now<input id="spi" type="number" inputmode="decimal" step="0.01" min="0.2" max="1.5"></label>
      <label class="site-field">CPI now<input id="cpi" type="number" inputmode="decimal" step="0.01" min="0.2" max="1.5"></label>
    </div>
    <label class="site-field">Value certified so far (% of contract)<input id="cert" type="number" inputmode="decimal" step="0.5" min="0" max="100"></label>

    <h2>Since the last update</h2>
    <p class="site-wx" id="wx">Checking live weather</p>
    <div id="events" class="site-events"></div>

    <div class="site-field"><span>Labour availability and productivity</span><div class="seg rate" data-rate="labour"></div></div>
    <div class="site-field"><span>Subcontractor performance</span><div class="seg rate" data-rate="subcontractor"></div></div>
    <label class="site-field">Rework so far
      <select id="rework"><option value="">No change</option><option>None</option><option>Under 2% of contract value</option><option>2-5%</option><option>Over 5%</option></select></label>
    <label class="site-field">Note for the project manager<textarea id="note" rows="3" placeholder="What happened, what you need"></textarea></label>

    <button class="btn primary site-send" id="send" type="submit">Send site update</button>
    <p class="fine" id="watchers"></p>
  </form>
  <div id="site-result" class="site-result" aria-live="polite"></div>
</main>
</body>
</html>
